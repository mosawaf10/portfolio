<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohamed Elsawaf | AI Engineering Portfolio</title>
<meta name="description" content="Mohamed Elsawaf — AI Engineering Portfolio">
<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{background:#080d1b;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}.topbar{position:fixed;z-index:10;top:0;left:0;right:0;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(8,13,27,.95),rgba(8,13,27,.45),transparent);pointer-events:none}.brand{font-size:13px;letter-spacing:2px;font-weight:700}.hint{font-size:12px;color:#aab4ca;letter-spacing:1px}.slides{width:100%}.slide{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 4vw}.slide img{display:block;width:min(1280px,94vw);height:auto;max-height:88vh;object-fit:contain;border-radius:3px;box-shadow:0 25px 80px rgba(0,0,0,.35)}.dots{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:8px}.dots a{width:8px;height:8px;border:1px solid #8490aa;border-radius:50%;display:block;opacity:.65;transition:.2s}.dots a:hover{background:#8490aa;opacity:1}.footer{padding:28px;text-align:center;color:#7f8aa3;font-size:12px;letter-spacing:1px}.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080d1b;z-index:20;font-size:14px;letter-spacing:2px}.slide img{opacity:0;transition:opacity .35s}.slide img.loaded{opacity:1}@media(max-width:700px){.hint{display:none}.slide{padding:58px 10px}.slide img{width:100%;max-height:none}.dots{right:8px}.dots a{width:6px;height:6px}}
</style>
</head>
<body>
<div class="loading" id="loading">LOADING PORTFOLIO...</div>
<header class="topbar"><div class="brand">MOHAMED ELSAWAF</div><div class="hint">AI ENGINEERING PORTFOLIO · SCROLL</div></header>
<nav class="dots" aria-label="Portfolio slides">
<a href="#slide1" title="Slide 1"></a><a href="#slide2" title="Slide 2"></a><a href="#slide3" title="Slide 3"></a><a href="#slide4" title="Slide 4"></a><a href="#slide5" title="Slide 5"></a><a href="#slide6" title="Slide 6"></a><a href="#slide7" title="Slide 7"></a><a href="#slide8" title="Slide 8"></a><a href="#slide9" title="Slide 9"></a><a href="#slide10" title="Slide 10"></a>
</nav>
<main class="slides">
<script>
for(let i=1;i<=10;i++)document.write(`<section class="slide" id="slide${i}"><img src="slides/slide-${String(i).padStart(2,'0')}.png" alt="Mohamed Elsawaf AI Engineering Portfolio slide ${i}" loading="${i===1?'eager':'lazy'}"></section>`);
</script>
</main>
<div class="footer">© 2026 Mohamed Elsawaf · AI Engineering Portfolio</div>
<script>
const imgs=[...document.querySelectorAll('img')];let loaded=0;imgs.forEach(img=>{if(img.complete){img.classList.add('loaded');loaded++}else img.addEventListener('load',()=>{img.classList.add('loaded');loaded++;if(loaded===imgs.length)document.getElementById('loading').style.display='none'})});if(loaded===imgs.length)document.getElementById('loading').style.display='none';
</script>
</body></html>
